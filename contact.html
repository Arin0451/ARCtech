<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>contact</title>
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/footer.css">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/contact.css">
</head>
<body>
    <div id="header"></div>
    <main>
      <div class="contact">

        <h2 class="section-title">FIND US</h2>

        <div class="find-us">
          <div class="map">
            <iframe 
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3026.673533027057!2d-74.00721809774609!3d40.65912634469871!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c25aea9eb8fad9%3A0x169f8963b4a88e43!2sLiberty%20View%20Industrial%20Plaza!5e0!3m2!1sru!2sus!4v1775525947376!5m2!1sru!2sus&hideattribution=1&controls=0" 
              width="600" 
              height="450" 
              style="border:0;" 
              allowfullscreen="" 
              loading="lazy">
            </iframe>
          </div>
          <div class="contacts">
            <div class="contact-item">new jersey, hudson county, industrial city, 5, 2 floor</div>
            <div class="contact-item"><a href="tel:+14514510451">+1 451 451 0451</a></div>
            <div class="contact-item"><a href="mailto:SUPPORT@ARCTECH.COM">support@arctech.com</a></div>
            <div class="contact-item">telegram channel <a href="https://t.me/ARCTECH" target="_blank">@arctech</a></div>
          </div>
        </div>
        <h2 class="section-title">feedback</h2>
        <div class="feedback">
          <form class="feedback-form">
            <div class="left">
              <label>name</label>
              <input type="text" placeholder="JHON JHON">
              <label>email</label>
              <input type="email" placeholder="EXAMPLE@MAIL.COM">
              <label>phone</label>
              <input type="text" placeholder="+1 000 000 0000">
            </div>
            <div class="right">
              <label>message</label>
              <textarea placeholder="TEXT"></textarea>
            </div>
            <button class="send-btn">send message</button>
          </form>
        </div>
      </div>
    </main>
    <div id="footer"></div>
    <script src="./js/include.js"></script>
</body>

</html>
