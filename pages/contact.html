<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>contact</title>
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/footer.css">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/contact.css">
</head>
<body>
    <div id="header"></div>
    <main>
      <div class="contact">

        <h2 class="section-title">FIND US</h2>

        <div class="find-us">
          <div class="map"><img src="../src/images/map.png" alt="map"></div>

          <div class="contacts">
            <div class="contact-item">NEW JERSEY, HUDSON COUNTY, INDUSTRIAL CITY, 5, 2 FLOOR</div>
            <div class="contact-item">+1 451 451 0451</div>
            <div class="contact-item">SUPPORT@ARCTECH.COM</div>
            <div class="contact-item">TELEGRAM CHANNEL @ARCTECH</div>
          </div>
        </div>
        <h2 class="section-title">FEEDBACK</h2>
        <div class="feedback">
          <form class="feedback-form">
            <div class="left">
              <label>NAME</label>
              <input type="text" placeholder="JHON JHON">
              <label>EMAIL</label>
              <input type="email" placeholder="EXAMPLE@MAIL.COM">
              <label>PHONE</label>
              <input type="text" placeholder="+1 000 000 0000">
            </div>
            <div class="right">
              <label>MASSAGE</label>
              <textarea placeholder="TEXT"></textarea>
            </div>
            <button class="send-btn">SEND MESSAGE</button>
          </form>
        </div>
      </div>
    </main>
    <div id="footer"></div>
    <script src="../js/include.js"></script>
</body>
</html>
